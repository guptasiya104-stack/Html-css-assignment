Build a basic HTML page with a title and a few headings.
<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>
</head>
<body>
    <h1>This is Main Heading - H1</h1>
    <h2>This is Sub Heading - H2</h2>
    <h3>This is Smaller Heading - H3</h3>
    
    <p>This is a paragraph under the headings. This page has a title and a few headings as required.</p>
</body>
</html>
